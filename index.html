<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Разбор заявки</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f5f6f8; color: #202936; font: 1rem/1.55 system-ui, sans-serif; }
    main { max-width: 44rem; margin: 3rem auto; padding: 0 1rem; }
    h1 { margin: 0; font-size: 1.8rem; }
    h2 { margin: 1rem 0 .5rem; font-size: 1.1rem; }
    header p, .hint { color: #596575; }
    form, #result { padding: 1.5rem; background: white; border: 1px solid #d9dfe7; border-radius: .5rem; }
    label { font-weight: 600; }
    textarea { display: block; width: 100%; min-height: 10rem; margin: .5rem 0; padding: .75rem; resize: vertical; border: 1px solid #8995a5; border-radius: .25rem; font: inherit; }
    textarea:focus-visible, button:focus-visible { outline: 3px solid #93b4ff; outline-offset: 2px; }
    textarea[aria-invalid="true"] { border-color: #b42318; }
    .hint { margin: .5rem 0 1rem; font-size: .875rem; }
    button { padding: .65rem 1rem; border: 0; border-radius: .25rem; background: #2456b8; color: white; font: inherit; font-weight: 600; cursor: pointer; }
    button:hover { background: #1d4696; }
    button:disabled { opacity: .65; cursor: wait; }
    #status { margin: 1rem 0; }
    #status:empty { display: none; }
    #status[data-state="error"] { color: #a21b13; }
    #status[data-state="manual_review"] { padding: 1rem; color: #684b08; background: #fff7df; border: 1px solid #e6d099; border-radius: .25rem; }
    #result p { margin: 0; }
    #draft { white-space: pre-wrap; overflow-wrap: anywhere; }
    #result .hint { margin-top: 1rem; }
    @media (max-width: 480px) { main { margin-top: 1.5rem; } form, #result { padding: 1rem; } }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Разбор заявки</h1>
      <p>Помощник определит тему обращения и предложит черновик ответа.</p>
    </header>
    <form novalidate>
      <label for="message">Текст заявки</label>
      <textarea id="message" rows="5" aria-describedby="input-hint status" placeholder="Например: сколько стоит доставка?"></textarea>
      <p class="hint" id="input-hint">Вставьте обращение клиента целиком.</p>
      <button type="submit">Разобрать заявку</button>
    </form>
    <p id="status" role="status" aria-live="polite"></p>
    <section id="result" aria-labelledby="result-title" hidden>
      <p>Тема: <strong id="topic"></strong></p>
      <h2 id="result-title">Черновик ответа</h2>
      <p id="draft"></p>
      <p class="hint">Проверьте текст перед отправкой клиенту.</p>
    </section>
  </main>
  <script type="module">
    const form = document.querySelector("form");
    const input = document.querySelector("#message");
    const button = form.querySelector("button");
    const status = document.querySelector("#status");
    const result = document.querySelector("#result");
    const topic = document.querySelector("#topic");
    const draft = document.querySelector("#draft");
    const topicLabels = new Map([
      ["delivery", "Доставка"],
      ["pricing", "Стоимость"],
      ["other", "Другое"],
    ]);
    let controller;
    let requestId = 0;

    function clearResult() {
      result.hidden = true;
      topic.textContent = "";
      draft.textContent = "";
    }

    function setStatus(message, state = "") {
      status.textContent = message;
      status.dataset.state = state;
    }

    function setLoading(loading) {
      button.disabled = loading;
      button.textContent = loading ? "Проверяем заявку…" : "Разобрать заявку";
      form.setAttribute("aria-busy", String(loading));
    }

    input.addEventListener("input", () => {
      requestId += 1;
      controller?.abort();
      clearResult();
      setStatus("");
      setLoading(false);
      input.removeAttribute("aria-invalid");
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const id = ++requestId;
      controller?.abort();
      clearResult();
      input.removeAttribute("aria-invalid");

      const text = input.value.trim();
      if (!text) {
        setLoading(false);
        setStatus("Введите текст заявки.", "error");
        input.setAttribute("aria-invalid", "true");
        input.focus();
        return;
      }

      const currentController = new AbortController();
      controller = currentController;
      const timer = setTimeout(() => currentController.abort(), 2000);
      setLoading(true);
      setStatus("Определяем тему и готовим черновик…");

      try {
        const reply = await fetch("/api/triage", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text }),
          signal: currentController.signal,
        });
        const data = await reply.json();
        if (id !== requestId) return;

        if (reply.status === 400 && data?.status === "invalid_input") {
          input.setAttribute("aria-invalid", "true");
          setStatus("Введите текст заявки.", "error");
          return;
        }
        if (!reply.ok) throw new Error("Request failed");

        if (data?.status === "manual_review") {
          setStatus("Нужен ручной разбор. Помощник не подготовил ответ. Текст заявки сохранён в поле выше: разберите её вручную или попробуйте ещё раз.", "manual_review");
          return;
        }
        if (data?.status !== "ready" || !topicLabels.has(data.topic) || typeof data.draft !== "string" || !data.draft.trim()) {
          throw new Error("Invalid response");
        }

        topic.textContent = topicLabels.get(data.topic);
        draft.textContent = data.draft.trim();
        result.hidden = false;
        setStatus("Черновик готов. Проверьте его перед отправкой.");
      } catch {
        if (id !== requestId) return;
        clearResult();
        setStatus("Нужен ручной разбор. Не удалось получить ответ сервера. Текст заявки сохранён в поле выше. Попробуйте ещё раз или обработайте её вручную.", "manual_review");
      } finally {
        clearTimeout(timer);
        if (id === requestId) {
          controller = undefined;
          setLoading(false);
        }
      }
    });
  </script>
</body>
</html>
